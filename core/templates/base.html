{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>MSWDO Admin</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body { font-family:Inter, sans-serif; background:#f5f7fa; margin:0; display:flex; }
    .sidebar { width:260px; background:#0e3b24; color:#fff; min-height:100vh; position:fixed; padding:20px; }
    .nav-link { color:#dfeee7; display:block; padding:10px; margin-bottom:6px; text-decoration:none; border-radius:8px; }
    .nav-link:hover{ background:#145433; color:#fff; }
    .main-content{ margin-left:280px; padding:24px; width:100%; }
    .card { border-radius:12px; }
  </style>
</head>
<body>
  <div class="sidebar">
    <div class="mb-4">
      <img src="/mnt/data/admin dash.png" alt="logo" style="width:44px;border-radius:50%;vertical-align:middle">
      <span style="font-weight:700; margin-left:10px;">MSWDO</span>
    </div>
    <a href="{% url 'dashboard' %}" class="nav-link">🏠 Dashboard</a>
    <a href="{% url 'assistance_program' %}" class="nav-link">🔎 Assistance Program</a>
    <a href="{% url 'pending_applications' %}" class="nav-link">🔎 Pending Applications</a>
    <a href="{% url 'admin_account' %}" class="nav-link">👤 Account</a>
    <hr style="border-color:#244e39;">
    <a href="{% url 'logout' %}" class="nav-link">🔒 Log Out</a>
  </div>

  <div class="main-content">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h3 style="margin:0;color:#113322">DASHBOARD</h3>
      
    </div>

    {% block content %}{% endblock %}
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>


  
</body>
</html>
