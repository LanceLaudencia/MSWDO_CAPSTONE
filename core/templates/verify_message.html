<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Verification Successful</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background-color: #f4f4f4;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
      }
      .container {
        background-color: white;
        padding: 40px;
        border-radius: 8px;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        text-align: center;
        max-width: 400px;
        width: 100%;
        animation: fadeIn 1s ease-in-out;
      }
      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      .checkmark {
        width: 80px;
        height: 80px;
        margin: 0 auto 20px;
        border-radius: 50%;
        background-color: #28a745;
        display: flex;
        justify-content: center;
        align-items: center;
        animation: checkmarkPulse 2s infinite;
      }
      @keyframes checkmarkPulse {
        0%,
        100% {
          transform: scale(1);
        }
        50% {
          transform: scale(1.1);
        }
      }
      .checkmark::after {
        content: "✓";
        font-size: 40px;
        color: white;
        animation: checkmarkDraw 1s ease-in-out 0.5s both;
      }
      @keyframes checkmarkDraw {
        from {
          opacity: 0;
          transform: scale(0.5);
        }
        to {
          opacity: 1;
          transform: scale(1);
        }
      }
      h1 {
        color: #28a745;
        margin-bottom: 20px;
        animation: slideUp 1s ease-in-out 0.3s both;
      }
      @keyframes slideUp {
        from {
          opacity: 0;
          transform: translateY(20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      p {
        color: #666;
        margin-bottom: 30px;
        animation: slideUp 1s ease-in-out 0.5s both;
      }
      a {
        background-color: #007bff;
        color: white;
        padding: 10px 20px;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        font-size: 16px;
        text-decoration: none;
        display: inline-block;
        transition: background-color 0.3s ease, transform 0.2s ease;
        animation: slideUp 1s ease-in-out 0.7s both;
      }
      a:hover {
        background-color: #0056b3;
        transform: translateY(-2px);
      }
      .footer {
        margin-top: 20px;
        font-size: 12px;
        color: #999;
        animation: slideUp 1s ease-in-out 0.9s both;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="checkmark"></div>
      <h1>Verification Successful</h1>
      <p>Thank you for your patience.</p>
      <a href="{% url 'login' %}">
        <button class="account-btn">
          <i class="fas fa-user"></i> Go to Login
        </button>
      </a>
      <div class="footer">
        If you have any questions, contact
        <a href="mailto:support@example.com">support</a>.
      </div>
    </div>
  </body>
</html>
