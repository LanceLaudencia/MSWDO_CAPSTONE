<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Verification Successful – MSWDO</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&family=Open+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --blue: #0038A8;
      --blue-dark: #002882;
      --blue-light: rgba(0, 56, 168, 0.08);
      --red: #CE1126;
      --red-dark: #a50d1e;
      --yellow: #FCD116;
    }

    body {
      font-family: 'Open Sans', sans-serif;
      background: #f0f2f7;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      position: relative;
      overflow: hidden;
      padding: 24px;
    }

    /* Tricolor top bar, same as the rest of the site */
    .top-bar {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 5px;
      background: linear-gradient(90deg, var(--blue) 0%, var(--blue) 33%, var(--red) 33%, var(--red) 66%, var(--yellow) 66%, var(--yellow) 100%);
      z-index: 100;
    }

    /* soft background blobs, matching the login/signup panels */
    body::before {
      content: '';
      position: fixed;
      top: -15%; right: -10%;
      width: 480px; height: 480px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(0,56,168,0.06), transparent 70%);
      pointer-events: none;
    }
    body::after {
      content: '';
      position: fixed;
      bottom: -15%; left: -10%;
      width: 420px; height: 420px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(252,209,22,0.08), transparent 70%);
      pointer-events: none;
    }

    .container {
      position: relative;
      z-index: 1;
      background: white;
      padding: 48px 40px 40px;
      border-radius: 18px;
      box-shadow: 0 20px 60px rgba(0, 40, 130, 0.14);
      text-align: center;
      max-width: 420px;
      width: 100%;
      animation: fadeIn 0.8s ease-out;
      overflow: hidden;
    }

    .container::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 4px;
      background: linear-gradient(90deg, var(--blue) 0%, var(--blue) 33%, var(--red) 33%, var(--red) 66%, var(--yellow) 66%, var(--yellow) 100%);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .seal-badge {
      width: 92px; height: 92px;
      margin: 8px auto 26px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--blue) 0%, var(--blue-dark) 100%);
      display: flex; align-items: center; justify-content: center;
      color: white;
      box-shadow:
        0 0 0 4px white,
        0 0 0 7px var(--blue),
        0 0 0 10px var(--red),
        0 0 0 13px var(--yellow),
        0 16px 34px rgba(0,40,130,0.28);
      animation: badgePulse 2.4s ease-in-out infinite;
    }

    @keyframes badgePulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }

    .seal-badge svg {
      width: 42px; height: 42px;
      animation: checkDraw 0.6s ease-out 0.4s both;
    }

    @keyframes checkDraw {
      from { opacity: 0; transform: scale(0.5); }
      to { opacity: 1; transform: scale(1); }
    }

    .eyebrow {
      display: inline-block;
      font-family: 'Montserrat', sans-serif;
      font-size: 0.65rem;
      font-weight: 700;
      color: var(--red);
      text-transform: uppercase;
      letter-spacing: 1.5px;
      margin-bottom: 8px;
      animation: slideUp 0.8s ease-out 0.15s both;
    }

    h1 {
      font-family: 'Montserrat', sans-serif;
      font-size: 1.6rem;
      font-weight: 800;
      color: #0f1f4b;
      margin-bottom: 12px;
      line-height: 1.25;
      animation: slideUp 0.8s ease-out 0.25s both;
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }

    p.desc {
      color: #5a6a8a;
      font-size: 0.9rem;
      line-height: 1.6;
      margin-bottom: 30px;
      animation: slideUp 0.8s ease-out 0.35s both;
    }

    .btn-login {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      background: linear-gradient(135deg, var(--blue) 0%, var(--blue-dark) 100%);
      color: white;
      padding: 14px 30px;
      border-radius: 10px;
      font-family: 'Montserrat', sans-serif;
      font-size: 0.8rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      text-decoration: none;
      box-shadow: 0 6px 18px rgba(0,56,168,0.25);
      transition: all 0.25s ease;
      position: relative;
      overflow: hidden;
      animation: slideUp 0.8s ease-out 0.45s both;
    }

    .btn-login::before {
      content: '';
      position: absolute; inset: 0;
      background: linear-gradient(135deg, var(--red) 0%, var(--red-dark) 100%);
      opacity: 0;
      transition: opacity 0.25s ease;
    }

    .btn-login:hover::before { opacity: 1; }
    .btn-login:hover { transform: translateY(-2px); box-shadow: 0 10px 26px rgba(206,17,38,0.32); }
    .btn-login svg, .btn-login span { position: relative; z-index: 1; }

    .flag-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      margin-top: 28px;
    }

    .flag-seg { height: 4px; border-radius: 2px; }

    .footer-text {
      margin-top: 8px;
      font-size: 0.68rem;
      color: #b0bace;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      animation: slideUp 0.8s ease-out 0.55s both;
    }

    @media (max-width: 480px) {
      .container { padding: 40px 26px 32px; }
      h1 { font-size: 1.35rem; }
    }
  </style>
</head>
<body>
  <div class="top-bar"></div>

  <div class="container">

    <div class="seal-badge">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="20 6 9 17 4 12"/>
      </svg>
    </div>

    <span class="eyebrow">Account Verification</span>
    <h1>Verification Successful</h1>
    <p class="desc">Thank you for your patience. Your account has been verified — you may now sign in to the MSWDO Assistance Portal.</p>

    <a href="{% url 'login' %}" class="btn-login">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
        <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/>
        <polyline points="10 17 15 12 10 7"/>
        <line x1="15" y1="12" x2="3" y2="12"/>
      </svg>
      <span>Go to Login</span>
    </a>

    <div class="flag-row">
      <div class="flag-seg" style="width:24px; background:#0038A8;"></div>
      <div class="flag-seg" style="width:24px; background:#CE1126;"></div>
      <div class="flag-seg" style="width:12px; background:#FCD116;"></div>
    </div>
    <p class="footer-text">Republic of the Philippines · Official Government System</p>

  </div>
</body>
</html>
