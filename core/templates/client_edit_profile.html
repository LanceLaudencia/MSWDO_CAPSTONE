{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Edit Profile</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #0f6e3f 0%, #2ecc71 100%);
            min-height: 100vh;
            padding: 60px 20px;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 70%);
            animation: pulse 15s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1) rotate(0deg); }
            50% { transform: scale(1.1) rotate(180deg); }
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 30px;
            padding: 50px 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            position: relative;
            z-index: 1;
        }

        .container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 6px;
            background: linear-gradient(90deg, #0f6e3f 0%, #27ae60 50%, #2ecc71 100%);
            border-radius: 30px 30px 0 0;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
            flex-wrap: wrap;
            gap: 20px;
        }

        h2 {
            font-size: 2.5rem;
            font-weight: 800;
            color: #0a4d2e;
        }

        .btn-back {
            background: white;
            color: #6c757d;
            border: 2px solid #e1e8ed;
            padding: 12px 30px;
            border-radius: 50px;
            font-size: 1rem;
            font-weight: 600;
            text-decoration: none;
            display: inline-block;
            transition: all 0.3s ease;
        }

        .btn-back:hover {
            background: #f8f9fa;
            border-color: #6c757d;
            color: #495057;
            text-decoration: none;
        }

        h4 {
            font-size: 1.3rem;
            font-weight: 700;
            color: #0a4d2e;
            margin: 35px 0 25px 0;
            padding-bottom: 12px;
            border-bottom: 3px solid #27ae60;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        h4::before {
            content: '';
            width: 5px;
            height: 30px;
            background: linear-gradient(180deg, #0f6e3f 0%, #27ae60 100%);
            border-radius: 3px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: 600;
            color: #2c3e50;
            margin-bottom: 8px;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input[type="text"],
        input[type="email"],
        input[type="number"],
        input[type="date"],
        select {
            width: 100%;
            padding: 14px 18px;
            border: 2px solid #e1e8ed;
            border-radius: 12px;
            font-size: 1rem;
            transition: all 0.3s ease;
            background: #fafafa;
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: #27ae60;
            box-shadow: 0 0 0 4px rgba(39, 174, 96, 0.1);
            background: white;
        }

        button[type="submit"] {
            width: 100%;
            background: linear-gradient(135deg, #0f6e3f 0%, #27ae60 100%);
            color: white;
            border: none;
            padding: 16px;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 20px rgba(15, 110, 63, 0.4);
            margin-top: 30px;
        }

        button[type="submit"]:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 30px rgba(15, 110, 63, 0.6);
        }

        @media (max-width: 768px) {
            .container {
                padding: 40px 30px;
            }

            h2 {
                font-size: 2rem;
            }

            .header {
                flex-direction: column;
                align-items: flex-start;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h2>Edit Profile</h2>
        <a href="{% url 'client_dashboard' %}" class="btn-back">
            ← Back to Dashboard
        </a>
    </div>

    <form method="POST">
        {% csrf_token %}

        <h4>Personal Information</h4>
        
        <div class="form-grid">
            <div>
                <label>First Name</label>
                <input name="first_name" value="{{ client.first_name }}" required>
            </div>
            <div>
                <label>Middle Name</label>
                <input name="middle_name" value="{{ client.middle_name }}">
            </div>
            <div>
                <label>Last Name</label>
                <input name="last_name" value="{{ client.last_name }}" required>
            </div>
        </div>

        <div class="form-grid">
            <div>
                <label>Sex</label>
                <select name="sex">
                    <option value="Male" {% if client.sex == "Male" %}selected{% endif %}>Male</option>
                    <option value="Female" {% if client.sex == "Female" %}selected{% endif %}>Female</option>
                </select>
            </div>
            <div>
                <label>Date of Birth</label>
                <input type="date" name="dob" value="{{ client.birth_date|date:'Y-m-d' }}">
            </div>
            <div>
                <label>Civil Status</label>
                <input name="civil_status" value="{{ client.civil_status }}">
            </div>
        </div>

        <div>
            <label>Nationality</label>
            <input name="nationality" value="{{ client.nationality }}">
        </div>

        <h4>Address & Contact</h4>
        
        <div>
            <label>Complete Address</label>
            <input name="address" value="{{ client.address }}">
        </div>

        <div class="form-grid">
            <div>
                <label>Barangay</label>
                <input name="barangay" value="{{ client.barangay }}">
            </div>
            <div>
                <label>Municipality</label>
                <input name="municipality" value="{{ client.municipality }}">
            </div>
        </div>

        <div class="form-grid">
            <div>
                <label>Contact Number</label>
                <input name="contact_number" value="{{ client.contact_no }}">
            </div>
            <div>
                <label>Email Address</label>
                <input type="email" name="email" value="{{ client.email }}">
            </div>
        </div>

        <h4>Socio-Economic Profile</h4>
        
        <div class="form-grid">
            <div>
                <label>Livelihood</label>
                <input name="livelihood" value="{{ client.livelihood }}">
            </div>
            <div>
                <label>Monthly Income (₱)</label>
                <input type="number" name="monthly_income" value="{{ client.monthly_income }}">
            </div>
            <div>
                <label>Household Size</label>
                <input type="number" name="household_size" value="{{ client.household_size }}">
            </div>
        </div>

        <div class="form-grid">
            <div>
                <label>Person with Disability</label>
                <select name="pwd">
                    <option value="Yes" {% if client.has_disability == "Yes" %}selected{% endif %}>Yes</option>
                    <option value="No" {% if client.has_disability == "No" %}selected{% endif %}>No</option>
                </select>
            </div>
            <div>
                <label>Senior Citizen</label>
                <select name="senior">
                    <option value="Yes" {% if client.is_senior == "Yes" %}selected{% endif %}>Yes</option>
                    <option value="No" {% if client.is_senior == "No" %}selected{% endif %}>No</option>
                </select>
            </div>
            <div>
                <label>Previous DSWD Aid</label>
                <select name="previous_dswd">
                    <option value="Yes" {% if client.previous_aid == "Yes" %}selected{% endif %}>Yes</option>
                    <option value="No" {% if client.previous_aid == "No" %}selected{% endif %}>No</option>
                </select>
            </div>
        </div>

        <button type="submit">Update Profile</button>
    </form>
</div>

</body>
</html>
