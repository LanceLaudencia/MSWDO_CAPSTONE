{% extends "base.html" %}
{% block content %}
<div class="card p-4">
  <h4>Confirm delete</h4>
  <p>Are you sure you want to delete application for <strong>{{ application.client.first_name }} {{ application.client.last_name }}</strong>?</p>
  <form method="post">
    {% csrf_token %}
    <button class="btn btn-danger" type="submit">Yes, delete</button>
    <a href="{% url 'assistance_program' %}" class="btn btn-secondary">Cancel</a>
  </form>
</div>
{% endblock %}
