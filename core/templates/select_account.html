<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Select Account – MSWDO</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      font-family: 'Poppins', sans-serif;
      display: flex;
      height: 100vh;
      background: #f7f9f8;
    }
    .left, .right {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px;
    }
    .right {
      background: #024b3c;
      color: white;
      text-align: center;
    }
    h1 {
      color: #024b3c;
      margin-bottom: 20px;
    }
    .card {
      background: #fff;
      border-radius: 10px;
      padding: 25px 40px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
      text-align: center;
      margin: 20px;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }
    .card:hover {
      transform: translateY(-5px);
      box-shadow: 0 6px 15px rgba(0,0,0,0.15);
    }
    .card img {
      width: 80px;
      margin-bottom: 15px;
    }
    button {
      background: #024b3c;
      color: #fff;
      border: none;
      padding: 10px 25px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 500;
      transition: background 0.3s ease;
    }
    button:hover {
      background: #01392e;
    }
    .return {
      margin-top: 20px;
      background: transparent;
      border: 2px solid #024b3c;
      color: #024b3c;
      font-weight: 600;
    }
    .return:hover {
      background: #024b3c;
      color: white;
    }
  </style>
</head>
<body>
  <div class="left">
    <h1>Select Account</h1>
    <div class="card">
      <img src="https://cdn-icons-png.flaticon.com/512/456/456212.png" alt="Admin">
      <h3>Admin</h3>
      <button onclick="window.location.href='{% url 'login' %}'">Continue as Admin</button>
    </div>
    <div class="card">
      <img src="https://cdn-icons-png.flaticon.com/512/1077/1077012.png" alt="Staff">
      <h3>Staff</h3>
      <button onclick="window.location.href='{% url 'login' %}'">Continue as Staff</button>
    </div>
    <button class="return" onclick="window.history.back()">← Return</button>
  </div>

  <div class="right">
    <h2>Reach Assistance Program</h2>
    <p>Use your Venus card around the world with no hidden fees. Hold, transfer, and spend money securely with MSWDO.</p>
  </div>
</body>
</html>
