{% extends "base.html" %}
{% block content %}
<div class="card p-4">
  <h4>Delete Client</h4>
  <p>Are you sure you want to delete <strong>{{ client.first_name }} {{ client.last_name }}</strong>?</p>

  <form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Yes, Delete</button>
    <a href="{% url 'pending_applications' %}" class="btn btn-secondary">Cancel</a>
  </form>
</div>
{% endblock %}
